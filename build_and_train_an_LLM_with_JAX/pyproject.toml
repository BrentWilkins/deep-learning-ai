[project]
name = "build-and-train-an-llm-with-jax"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "flax>=0.12.8",
    "datasets>=5.0.1",
    "gradio>=6.20.0",
    "grain>=0.2.18",
    "ipywidgets>=8.1.8",
    "jax[cuda13]>=0.11.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "tiktoken>=0.13.0",
    "typing-extensions>=4.16.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "nbqa>=1.9.1",
    "pre-commit>=4.6.1",
    "ruff>=0.16.0",
]
