[project]
name = "building-agentic-rag-with-llamaindex"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "llama-index>=0.14.23",
    "llama-index-embeddings-huggingface>=0.7.0",
    "llama-index-embeddings-openai-like>=0.3.1",
    "llama-index-llms-openai-like>=0.7.2",
    "llama-index-readers-file>=0.6.0",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.6.1",
]

[dependency-groups]
dev = [
    "ipython>=9.15.0",
    "mypy>=2.3.0",
    "nbqa>=1.9.1",
    "pre-commit>=4.6.1",
    "ruff>=0.16.0",
]
